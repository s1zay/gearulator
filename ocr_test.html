<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesseract.js Diagnostic Tester</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body {
            background-color: #1a1a1a;
            color: #eaeaea;
            font-family: monospace;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .control-panel {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        #imagePreview {
            max-width: 100%;
            max-height: 300px;
            display: none;
            margin-top: 15px;
            border: 2px solid #444;
        }
        #status {
            color: #ffc107;
            font-weight: bold;
            margin-top: 15px;
        }
        textarea {
            width: 100%;
            height: 400px;
            background: #000;
            color: #00ff00;
            font-family: monospace;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 4px;
            resize: vertical;
        }
    </style>
</head>
<body>

    <h2>Tesseract.js Diagnostic Sandbox</h2>

    <div class="control-panel">
        <input type="file" id="uploader" accept="image/*">
        <div id="status">Waiting for image upload...</div>
        <img id="imagePreview" alt="Image Preview">
    </div>

    <h3>Raw OCR Output:</h3>
    <textarea id="output" readonly></textarea>

    <script>
        const uploader = document.getElementById('uploader');
        const preview = document.getElementById('imagePreview');
        const statusEl = document.getElementById('status');
        const outputEl = document.getElementById('output');

        uploader.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            // 1. Show the image preview
            const reader = new FileReader();
            reader.onload = function(event) {
                preview.src = event.target.result;
                preview.style.display = 'block';
                runOCR(event.target.result);
            }
            reader.readAsDataURL(file);
        });

        async function runOCR(imageData) {
            statusEl.innerText = "Initializing Tesseract engine...";
            outputEl.value = ""; 

            try {
                // 2. Run Tesseract on the uploaded image
                const worker = await Tesseract.createWorker("eng", 1, {
                    logger: m => {
                        // Update status with the progress percentage
                        if (m.status === 'recognizing text') {
                            statusEl.innerText = `Scanning Image: ${Math.round(m.progress * 100)}%`;
                        } else {
                            statusEl.innerText = m.status;
                        }
                    }
                });

                const { data: { text } } = await worker.recognize(imageData);
                
                // 3. Display the raw results
                statusEl.innerText = "Scan Complete! Review the raw output below.";
                statusEl.style.color = "#4caf50";
                outputEl.value = text;

                await worker.terminate();

            } catch (error) {
                statusEl.innerText = "Error during OCR process.";
                statusEl.style.color = "#ff3333";
                outputEl.value = error;
                console.error(error);
            }
        }
    </script>
</body>
</html>
