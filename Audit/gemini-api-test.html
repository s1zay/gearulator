<!DOCTYPE html>
<html lang="en">
<body>
    <h2>Gemini API Sanity Check</h2>
    <input type="text" id="testKey" placeholder="Paste API Key here..." style="width: 300px; padding: 5px;">
    <button onclick="testGoogleAPI()">Send Test</button>
    <p id="test-status" style="font-weight: bold; color: #d35400;">Waiting for test...</p>
    
    <script>
        async function testGoogleAPI() {
            const apiKey = document.getElementById('testKey').value.trim();
            const status = document.getElementById('test-status');
            
            if (!apiKey) return alert("Paste your key first!");
            status.innerText = "Connecting to Google...";

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "Say the exact words: Connection Successful!" }] }]
                    })
                });

                const data = await response.json();
                console.log("Raw Response:", data);

                if (!response.ok) {
                    status.innerText = `Error ${response.status}: ${data.error ? data.error.message : "Unknown Error"}`;
                } else {
                    const text = data.candidates[0].content.parts[0].text;
                    status.innerText = `SUCCESS! Google says: ${text}`;
                }

            } catch (error) {
                status.innerText = "CRITICAL CRASH: Check F12 Console";
                console.error(error);
            }
        }
    </script>
</body>
</html>
