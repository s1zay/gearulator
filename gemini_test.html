<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Vision OCR Sandbox</title>
    <style>
        body { background-color: #1a1a1a; color: #eaeaea; font-family: monospace; padding: 20px; max-width: 800px; margin: 0 auto; }
        .control-panel { background: #2a2a2a; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .input-row { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        input[type="text"] { padding: 10px; background: #111; color: #fff; border: 1px solid #555; border-radius: 4px; font-family: monospace; }
        button { background: #ffc107; color: #000; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #e0a800; }
        #status { color: #ffc107; font-weight: bold; margin-top: 10px; }
        textarea { width: 100%; height: 500px; background: #000; color: #00ffff; font-family: monospace; padding: 10px; border: 1px solid #444; border-radius: 4px; resize: vertical; }
        #imagePreview { max-width: 100%; max-height: 200px; display: none; margin-top: 10px; border: 1px solid #444; }
    </style>
</head>
<body>

    <h2>Gemini Vision Extraction Test</h2>

    <div class="control-panel">
        <div class="input-row">
            <label>1. Paste Gemini API Key:</label>
            <input type="text" id="apiKey" placeholder="AIzaSy...">
        </div>
        <div class="input-row">
            <label>2. Upload Raid Screenshot:</label>
            <input type="file" id="uploader" accept="image/*">
        </div>
        <img id="imagePreview">
        <button onclick="runGeminiVision()">Extract Data with Gemini</button>
        <div id="status">Waiting for image...</div>
    </div>

    <h3>Extracted JSON Data:</h3>
    <textarea id="output" readonly></textarea>

    <script>
        let base64Image = "";

        // Preview the image and convert it to Base64 for the API
        document.getElementById('uploader').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                document.getElementById('imagePreview').src = event.target.result;
                document.getElementById('imagePreview').style.display = 'block';
                // Strip the data URL prefix to get raw base64 string
                base64Image = event.target.result.split(',')[1];
            }
            reader.readAsDataURL(file);
        });

        async function runGeminiVision() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const statusEl = document.getElementById('status');
            const outputEl = document.getElementById('output');

            if (!apiKey || !base64Image) {
                statusEl.innerText = "Error: Need both an API key and an image!";
                statusEl.style.color = "#ff3333";
                return;
            }

            statusEl.innerText = "Sending to Gemini AI... (this usually takes 3-5 seconds)";
            statusEl.style.color = "#ffc107";
            outputEl.value = "";

            // The strict prompt telling Gemini exactly how to read the grid
            const promptText = `
                Analyze this image of a Raid: Shadow Legends stat screen.
                Extract the data into a strict JSON object matching this exact structure.
                If a cell in the grid is visually empty or blank, you MUST output the number 0.
                Remove commas from numbers. Strip out any % symbols and treat them as boolean flags (isPct).
                Only return the raw JSON block, no markdown formatting or conversational text.
                
                Structure to match:
                {
                    "champion": "Name of Champion",
                    "level": 60,
                    "ascensionStars": number of purple and/or yellow stars,
                    "awakeningStars": number of red stars,
                    "form": "Base Form or Alternate Form",
                    "stats": {
                        "HP": { "base": 0, "art": 0, "affin": 0, "arena": 0, "mast": 0, "fg": 0, "emp": 0, "bless": 0, "relic": 0, "area": 0, "total": 0, "isPct": false },
                        "ATK": { "base": 0, "art": 0, "affin": 0, "arena": 0, "mast": 0, "fg": 0, "emp": 0, "bless": 0, "relic": 0, "area": 0, "total": 0, "isPct": false },
                        "DEF": { "base": 0, "art": 0, "affin": 0, "arena": 0, "mast": 0, "fg": 0, "emp": 0, "bless": 0, "relic": 0, "area": 0, "total": 0, "isPct": false },
                        "SPD": { "base": 0, "art": 0, "affin": 0, "arena": 0, "mast": 0, "fg": 0, "emp": 0, "bless": 0, "relic": 0, "area": 0, "total": 0, "isPct": false },
                        "CR": { "base": 0, "art": 0, "affin": 0, "arena": 0, "mast": 0, "fg": 0, "emp": 0, "bless": 0, "relic": 0, "area": 0, "total": 0, "isPct": true },
                        "CD": { "base": 0, "art": 0, "affin": 0, "arena": 0, "mast": 0, "fg": 0, "emp": 0, "bless": 0, "relic": 0, "area": 0, "total": 0, "isPct": true },
                        "RES": { "base": 0, "art": 0, "affin": 0, "arena": 0, "mast": 0, "fg": 0, "emp": 0, "bless": 0, "relic": 0, "area": 0, "total": 0, "isPct": false },
                        "ACC": { "base": 0, "art": 0, "affin": 0, "arena": 0, "mast": 0, "fg": 0, "emp": 0, "bless": 0, "relic": 0, "area": 0, "total": 0, "isPct": false }
                    }
                }
            `;

            const requestBody = {
                contents: [{
                    parts: [
                        { text: promptText },
                        { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                    ]
                }],
                generationConfig: { response_mime_type: "application/json" } // Force JSON output
            };

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(requestBody)
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }

                // Extract the AI's text response
                const aiText = data.candidates[0].content.parts[0].text;
                
                statusEl.innerText = "Success! JSON extracted.";
                statusEl.style.color = "#4caf50";
                
                // Pretty print the JSON into the text area
                outputEl.value = JSON.stringify(JSON.parse(aiText), null, 4);

            } catch (error) {
                statusEl.innerText = "API Error.";
                statusEl.style.color = "#ff3333";
                outputEl.value = error.message;
            }
        }
    </script>
</body>
</html>
